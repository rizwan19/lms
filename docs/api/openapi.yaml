      summary: "Change schedule and policies (required flag only on drafts)"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /me/enrollments/{id}/exams:
    get:
      tags: [attempts]
      summary: "Own exams of an enrollment"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /exams/{id}/attempts:
