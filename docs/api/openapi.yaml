openapi: 3.1.0
info:
  title: Learning Portal API
  version: 0.1.0
  description: |
    Same-origin REST API under /api/v1. Sessions are cookie-based (Spring Session JDBC); every
    mutating request carries the CSRF token from GET /auth/csrf in the X-XSRF-TOKEN header.
    Errors use RFC 9457-style problem responses {type,title,status,detail,code,fieldErrors,traceId}.
    Pages use {items,page,size,total} with zero-based pages, default size 25 and maximum 100.
    Unrelated or forbidden resources answer 404 so their existence is not exposed.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: setup
  - name: users
  - name: institution
  - name: notifications
  - name: operations
  - name: media
  - name: courses
  - name: classes
  - name: learning
  - name: exams
  - name: attempts
  - name: grading
  - name: certificates
  - name: reports
paths:
  /auth/csrf:
    get:
      tags: [auth]
      summary: Issue the CSRF cookie and return the token
      responses:
        '200': { description: Token, content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with username (or email) and password; rotates session ID and CSRF token
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out and invalidate the session
      x-security-filter: true
      responses:
        '204': { description: Signed out }
  /auth/me:
    get:
      tags: [auth]
      summary: Current account
      responses:
        '200': { description: Account, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/me/password:
    put:
      tags: [auth]
      summary: Change own password; revokes the account's other sessions
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePassword' } } } }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/Problem' }
  /auth/password-reset/request:
    post:
      tags: [auth]
      summary: Request a reset email; always 202 so account existence is not revealed
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [usernameOrEmail], properties: { usernameOrEmail: { type: string } } } } } }
      responses:
        '202': { description: Accepted }
  /auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Set a new password with a 30-minute single-use token; revokes sessions
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPassword' } } } }
      responses:
        '204': { description: Password set }
        '400': { $ref: '#/components/responses/Problem' }
  /auth/invitations/accept:
    post:
      tags: [auth]
      summary: Set the first password with a 72-hour single-use invitation token
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPassword' } } } }
      responses:
        '204': { description: Password set }
        '400': { $ref: '#/components/responses/Problem' }
  /setup:
    get:
      tags: [setup]
      summary: Whether first-administrator setup is still required
      responses:
        '200': { description: Status, content: { application/json: { schema: { type: object, properties: { required: { type: boolean } } } } } }
    post:
      tags: [setup]
      summary: One-use installation setup with the operator-supplied setup token
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetupRequest' } } } }
      responses:
        '201': { description: Administrator created, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /users:
    get:
      tags: [users]
      summary: Accounts in the caller's scope (administrators all; teachers their students)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Page of accounts, content: { application/json: { schema: { $ref: '#/components/schemas/AccountPage' } } } }
    post:
      tags: [users]
      summary: Create an account; teachers may only create students. Response is no-store.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAccount' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedAccount' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [users]
      summary: Account in scope
      responses:
        '200': { description: Account, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [users]
      summary: Administrator profile and role update with expected revision
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAccount' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /users/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [users]
      summary: Enable or disable an account (administrator); disabling revokes sessions
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/AccountStatus' } } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /users/{id}/assisted-reset:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [users]
      summary: Issue a 24-hour one-use temporary password; revokes sessions and forces a password change. No-store.
      responses:
        '200': { description: Temporary credential, content: { application/json: { schema: { $ref: '#/components/schemas/TemporaryCredential' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /institution:
    get:
      tags: [institution]
      summary: Public institution name and timezone
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/Institution' } } } }
    put:
      tags: [institution]
      summary: Administrator settings update with expected revision
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateInstitution' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Institution' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /notifications:
    get:
      tags: [notifications]
      summary: Own in-app notifications, newest first
      parameters:
        - { name: unreadOnly, in: query, schema: { type: boolean, default: false } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Page of notifications, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } } }
  /notifications/{id}/read:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [notifications]
      summary: Mark an own notification read (idempotent)
      responses:
        '204': { description: Marked read }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/system-status:
    get:
      tags: [operations]
      summary: Administrator delivery health
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { type: object, properties: { emailConfigured: { type: boolean }, failedJobs: { type: integer } } } } }
  /admin/failed-jobs:
    get:
      tags: [operations]
      summary: Terminally failed background jobs (administrator)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Page of failed jobs, content: { application/json: { schema: { $ref: '#/components/schemas/FailedJobPage' } } } }
  /media:
    post:
      tags: [media]
      summary: Upload a file as the raw request body (streamed; staff only, branding images administrators only)
      description: |
        Accepted: VIDEO video/mp4 (H.264/AAC, max 500 MiB); DOCUMENT application/pdf or text/plain (UTF-8, max 25 MiB);
        BRANDING_IMAGE image/png or image/jpeg (max 5 MiB, re-encoded as PNG). Content must match the declared type.
      parameters:
        - { name: purpose, in: query, required: true, schema: { $ref: '#/components/schemas/AssetPurpose' } }
        - { name: filename, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          video/mp4: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
          text/plain: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
      responses:
        '201': { description: Available asset, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /media/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [media]
      summary: Metadata of a readable asset
      responses:
        '200': { description: Asset, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /media/{id}/content:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [media]
      summary: Private delivery, authorized on every request; supports a single HTTP Range. Cache-Control private, no-store.
      parameters:
        - { name: download, in: query, schema: { type: boolean, default: false } }
        - { name: Range, in: header, schema: { type: string, example: bytes=0-1023 } }
      responses:
        '200': { description: Whole file }
        '206': { description: Requested range }
        '404': { $ref: '#/components/responses/Problem' }
        '416': { description: Range not satisfiable }
  /courses:
    get:
      tags: [courses]
      summary: Courses the caller authors (administrators see all)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, ARCHIVED], default: ACTIVE } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Page of course summaries, content: { application/json: { schema: { $ref: '#/components/schemas/CourseSummaryPage' } } } }
    post:
      tags: [courses]
      summary: Create a course with an empty draft; the creator becomes a course teacher
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string, maxLength: 200 } } } } } }
      responses:
        '201': { description: Course, content: { application/json: { schema: { $ref: '#/components/schemas/CourseDetail' } } } }
  /courses/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [courses]
      summary: Course detail with teachers, editions and draft header
      responses:
        '200': { description: Course, content: { application/json: { schema: { $ref: '#/components/schemas/CourseDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /courses/{id}/draft:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [courses]
      summary: The editable draft (409 NO_DRAFT when none exists)
      responses:
        '200': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } } }
        '409': { $ref: '#/components/responses/Problem' }
    put:
      tags: [courses]
      summary: Replace the draft tree with expected revision; HTML is sanitized, embeds take provider IDs only
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DraftInput' } } } }
      responses:
        '200': { description: Saved draft, content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    post:
      tags: [courses]
      summary: Start a correction draft copied from a published edition (409 DRAFT_EXISTS)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fromVersionId], properties: { fromVersionId: { type: string, format: uuid } } } } } }
      responses:
        '201': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /courses/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [courses]
      summary: Seal the draft as the next immutable edition
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expectedRevision], properties: { expectedRevision: { type: integer } } } } } }
      responses:
        '200': { description: Published edition, content: { application/json: { schema: { $ref: '#/components/schemas/PublishedCourse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /courses/{id}/preview:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [courses]
      summary: Draft (default) or a given edition as students see it
      parameters:
        - { name: versionId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/CoursePreview' } } } }
  /courses/{id}/archive:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [courses]
      summary: Remove from catalogue and class creation; existing classes keep access
      responses:
        '204': { description: Archived }
  /courses/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [courses]
      summary: Return an archived course to the active list
      responses:
        '204': { description: Restored }
  /courses/{id}/teachers:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [courses]
      summary: Replace course teachers (administrator)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [teacherIds], properties: { teacherIds: { type: array, items: { type: string, format: uuid } } } } } } }
      responses:
        '200': { description: Course, content: { application/json: { schema: { $ref: '#/components/schemas/CourseDetail' } } } }
  /classes:
    get:
      tags: [classes]
      summary: Classes the caller teaches (administrators see all)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Page of classes, content: { application/json: { schema: { $ref: '#/components/schemas/ClassSummaryPage' } } } }
    post:
      tags: [classes]
      summary: Create a DRAFT class for a published, non-archived edition (course teacher or administrator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseVersionId, name]
              properties:
                courseVersionId: { type: string, format: uuid }
                name: { type: string, maxLength: 200 }
                startsAt: { type: [string, 'null'], format: date-time }
                endsAt: { type: [string, 'null'], format: date-time }
      responses:
        '201': { description: Class, content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } } }
  /classes/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [classes]
      summary: Class detail (assigned class teacher or administrator)
      responses:
        '200': { description: Class, content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [classes]
      summary: Rename or reschedule with expected revision (audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expectedRevision]
              properties:
                name: { type: string }
                startsAt: { type: [string, 'null'], format: date-time }
                endsAt: { type: [string, 'null'], format: date-time }
                expectedRevision: { type: integer }
      responses:
        '200': { description: Class, content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /classes/{id}/activate:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [classes]
      summary: DRAFT → ACTIVE
      responses:
        '200': { description: Class, content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /classes/{id}/archive:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [classes]
      summary: Archive; learning access ends, history stays readable
      responses:
        '200': { description: Class, content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } } }
  /classes/{id}/teachers:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [classes]
      summary: Replace class teachers; removed teachers lose access on their next request
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [teacherIds], properties: { teacherIds: { type: array, items: { type: string, format: uuid } } } } } } }
      responses:
        '200': { description: Class, content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } } }
  /classes/{id}/enrollments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [classes]
      summary: Class roster
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED, WITHDRAWN] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Page of roster rows, content: { application/json: { schema: { $ref: '#/components/schemas/RosterPage' } } } }
    post:
      tags: [classes]
      summary: Enroll an existing active student by username (409 ALREADY_ENROLLED)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [username], properties: { username: { type: string } } } } } }
      responses:
        '201': { description: Enrollment, content: { application/json: { schema: { $ref: '#/components/schemas/RosterRow' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /classes/{id}/enrollments/{enrollmentId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [classes]
      summary: Activate, suspend or withdraw an enrollment
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ACTIVE, SUSPENDED, WITHDRAWN] } } } } } }
      responses:
        '200': { description: Enrollment, content: { application/json: { schema: { $ref: '#/components/schemas/RosterRow' } } } }
  /classes/{id}/imports/preview:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [classes]
      summary: Validate a roster CSV (username,display_name,email; UTF-8, optional BOM, max 1 MiB and 1,000 rows)
      requestBody: { required: true, content: { text/csv: { schema: { type: string } } } }
      responses:
        '200': { description: Row-by-row validation, content: { application/json: { schema: { $ref: '#/components/schemas/RosterImportPreview' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
  /classes/{id}/imports/commit:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [classes]
      summary: Revalidate and import all rows or none. Returns one-time temporary passwords for students without invitations (no-store).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digest, rows]
              properties:
                digest: { type: string }
                rows: { type: array, maxItems: 1000, items: { type: object, properties: { username: { type: string }, displayName: { type: string }, email: { type: [string, 'null'] } } } }
      responses:
        '200':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrolled: { type: integer }
                  created: { type: integer }
                  invited: { type: integer }
                  credentials: { type: array, items: { $ref: '#/components/schemas/TemporaryCredential' } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/learning:
    get:
      tags: [learning]
      summary: Own enrollments with progress, including historical ones
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    enrollmentId: { type: string, format: uuid }
                    className: { type: string }
                    courseTitle: { type: string }
                    edition: { type: integer }
                    enrollmentStatus: { type: string, enum: [ACTIVE, SUSPENDED, WITHDRAWN] }
                    classStatus: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
                    accessOpen: { type: boolean }
                    startsAt: { type: [string, 'null'], format: date-time }
                    endsAt: { type: [string, 'null'], format: date-time }
                    summary: { $ref: '#/components/schemas/LessonSummary' }
  /me/enrollments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [learning]
      summary: Course player for an own active enrollment in an open class (403 ENROLLMENT_INACTIVE otherwise)
      responses:
        '200':
          description: Player
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollmentId: { type: string, format: uuid }
                  className: { type: string }
                  course: { $ref: '#/components/schemas/PublishedCourse' }
                  progress: { type: array, items: { $ref: '#/components/schemas/LessonProgress' } }
                  summary: { $ref: '#/components/schemas/LessonSummary' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /enrollments/{id}/lessons/{lessonId}/progress:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [learning]
      summary: Save explicit completion and resume position with expected revision (0 creates); resume never decreases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, completed, resumeSeconds]
              properties:
                expectedRevision: { type: integer }
                completed: { type: boolean }
                resumeSeconds: { type: integer, minimum: 0 }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/LessonProgress' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /exams:
    get:
      tags: [exams]
      summary: Exams of a course (course authors); latest edition and draft revision per exam
      parameters: [{ name: courseId, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Exams, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExamSummary' } } } } }
    post:
      tags: [exams]
      summary: Create an exam with an empty draft
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [courseId, title], properties: { courseId: { type: string, format: uuid }, title: { type: string } } } } } }
      responses:
        '201': { description: Exam, content: { application/json: { schema: { $ref: '#/components/schemas/ExamDetail' } } } }
  /exams/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [exams]
      summary: Exam editions and draft header
      responses:
        '200': { description: Exam, content: { application/json: { schema: { $ref: '#/components/schemas/ExamDetail' } } } }
  /exams/{id}/draft:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [exams]
      summary: Draft with answer keys (authors only)
      responses:
        '200': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/ExamContent' } } } }
    put:
      tags: [exams]
      summary: Replace draft questions with expected revision; 1-100 questions, prompts up to 10,000 characters, points with 2 decimals
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExamDraftInput' } } } }
      responses:
        '200': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/ExamContent' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    post:
      tags: [exams]
      summary: Start a correction draft from a published edition
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fromVersionId], properties: { fromVersionId: { type: string, format: uuid } } } } } }
      responses:
        '201': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/ExamContent' } } } }
  /exams/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [exams]
      summary: Seal the draft as the next immutable edition; objective questions need complete keys
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expectedRevision], properties: { expectedRevision: { type: integer } } } } } }
      responses:
        '200': { description: Edition, content: { application/json: { schema: { $ref: '#/components/schemas/ExamContent' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /exams/{id}/editions/{versionId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [exams]
      summary: Teacher preview of an edition, including keys
      responses:
        '200': { description: Edition, content: { application/json: { schema: { $ref: '#/components/schemas/ExamContent' } } } }
  /exam-assignments:
    get:
      tags: [exams]
      summary: Exam schedules of a class (class teachers)
      parameters: [{ name: classId, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Assignments, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExamAssignment' } } } } }
    post:
      tags: [exams]
      summary: Add an optional practice assignment for a published exam of the class's course
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ScheduleInput' }, { type: object, required: [classId, examVersionId], properties: { classId: { type: string, format: uuid }, examVersionId: { type: string, format: uuid } } }] } } } }
      responses:
        '201': { description: Assignment, content: { application/json: { schema: { $ref: '#/components/schemas/ExamAssignment' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /exam-assignments/available:
    get:
      tags: [exams]
      summary: Published exams of the class's course
      parameters: [{ name: classId, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Exams, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExamSummary' } } } } }
  /exam-assignments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [exams]
      summary: Reschedule or change policies; the exam edition and required flag never change
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ScheduleInput' }, { type: object, required: [expectedRevision], properties: { expectedRevision: { type: integer } } }] } } } }
      responses:
        '200': { description: Assignment, content: { application/json: { schema: { $ref: '#/components/schemas/ExamAssignment' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/enrollments/{id}/exams:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [attempts]
      summary: Own exams for an enrollment with own attempts (no keys, no unpublished scores)
      responses:
        '200': { description: Exams, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StudentExam' } } } } }
  /exam-assignments/{id}/attempts:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [attempts]
      summary: Start an attempt, or return the one in progress; deadline = min(start + duration, closing time)
      responses:
        '200': { description: Attempt, content: { application/json: { schema: { $ref: '#/components/schemas/AttemptView' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: EXAM_NOT_OPEN or ATTEMPT_LIMIT_REACHED, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /attempts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [attempts]
      summary: Own attempt; an expired attempt is finalized from saved answers first
      responses:
        '200': { description: Attempt, content: { application/json: { schema: { $ref: '#/components/schemas/AttemptView' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /attempts/{id}/answers/{questionId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [attempts]
      summary: Save one answer with expected revision (0 creates)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer }
                selectedOptionIds: { type: array, items: { type: string, format: uuid } }
                writtenText: { type: [string, 'null'], maxLength: 20000 }
      responses:
        '200': { description: Durably saved, content: { application/json: { schema: { type: object, properties: { questionId: { type: string, format: uuid }, revision: { type: integer }, savedAt: { type: string, format: date-time } } } } } }
        '409': { description: ANSWER_REVISION_CONFLICT (body.current holds the saved answer), ATTEMPT_EXPIRED or ATTEMPT_CLOSED, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /attempts/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [attempts]
      summary: Finalize once from saved answers; repeated calls return the same outcome
      responses:
        '200': { description: Outcome, content: { application/json: { schema: { type: object, properties: { attemptId: { type: string, format: uuid }, status: { type: string }, finalizedReason: { type: string, enum: [SUBMITTED, EXPIRED] }, finalizedAt: { type: string, format: date-time } } } } } }
  /grading:
    get:
      tags: [grading]
      summary: Grading queue of a class (class teachers); unpublished work first
      parameters:
        - { name: classId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, PUBLISHED, ALL], default: PENDING } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Page of attempts }
  /grading/attempts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [grading]
      summary: Attempt with key, answers, current revision grades and revision history (staff only)
      responses:
        '200': { description: Grade view }
        '404': { $ref: '#/components/responses/Problem' }
  /grading/attempts/{id}/answers/{questionId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [grading]
      summary: Grade a written answer (0 to question points, 2 decimals) or add feedback (max 5000 characters); expected revision
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expectedRevision], properties: { expectedRevision: { type: integer }, points: { type: [number, 'null'] }, feedback: { type: string } } } } } }
      responses:
        '200': { description: Grade }
        '409': { $ref: '#/components/responses/Problem' }
  /grading/attempts/{id}/finalize:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [grading]
      summary: Sum grades once every written answer is graded (409 GRADING_INCOMPLETE otherwise)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expectedRevision], properties: { expectedRevision: { type: integer } } } } } }
      responses:
        '200': { description: Finalized revision }
        '409': { $ref: '#/components/responses/Problem' }
  /grading/attempts/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [grading]
      summary: Publish the finalized revision as an immutable result; supersedes the previous one
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expectedRevision], properties: { expectedRevision: { type: integer } } } } } }
      responses:
        '200': { description: Published result }
        '409': { $ref: '#/components/responses/Problem' }
  /grading/attempts/{id}/regrade:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [grading]
      summary: Open a new draft from the published grades with a reason (max 1000); students keep the old result until republication
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 1000 } } } } } }
      responses:
        '200': { description: New draft revision }
        '409': { $ref: '#/components/responses/Problem' }
  /me/results:
    get:
      tags: [grading]
      summary: Own finalized attempts; PENDING results carry no score
      responses:
        '200': { description: Results }
  /me/results/{attemptId}:
    parameters: [{ name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [grading]
      summary: Own published result with per-question points and feedback; keys and explanations only when the feedback policy releases them
      responses:
        '200': { description: Result }
        '404': { $ref: '#/components/responses/Problem' }
  /me/enrollments/{id}/completion:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [learning]
      summary: Own completion status with lesson and required-exam requirements (pending grading shown explicitly)
      responses:
        '200':
          description: Completion state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollmentId: { type: string, format: uuid }
                  status: { type: string, enum: [NOT_ELIGIBLE, ACHIEVED, INVALIDATED] }
                  completionId: { type: [string, 'null'], format: uuid }
                  lessons: { $ref: '#/components/schemas/LessonSummary' }
                  exams: { type: array, items: { type: object, properties: { assignmentId: { type: string, format: uuid }, title: { type: string }, publishedPass: { type: boolean }, pendingGrading: { type: boolean } } } }
  /me/certificates:
    get:
      tags: [certificates]
      summary: Own certificates (never includes the verification token)
      responses:
        '200': { description: Certificates, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Certificate' } } } } }
  /certificates:
    get:
      tags: [certificates]
      summary: Certificates of a class (class teachers and administrators)
      parameters: [{ name: classId, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Certificates, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Certificate' } } } } }
  /certificates/{id}/download:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [certificates]
      summary: PDF for the owner (also after withdrawal) or the class's teachers; issued certificates only
      responses:
        '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /certificates/{id}/revoke:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [certificates]
      summary: Revoke with a reason (class teachers and administrators; audited)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 1000 } } } } } }
      responses:
        '200': { description: Certificate, content: { application/json: { schema: { $ref: '#/components/schemas/Certificate' } } } }
  /certificates/{id}/reinstate:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [certificates]
      summary: Administrator reinstatement with a reason; requires an achieved completion and re-renders from the original snapshot
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 1000 } } } } } }
      responses:
        '200': { description: Certificate, content: { application/json: { schema: { $ref: '#/components/schemas/Certificate' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /certificates/{id}/retry:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [certificates]
      summary: Retry a failed render
      responses:
        '200': { description: Certificate, content: { application/json: { schema: { $ref: '#/components/schemas/Certificate' } } } }
  /public/certificates/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    get:
      tags: [certificates]
      summary: Public verification (404 when disabled or unknown); minimal data, student only when enabled at issuance
      security: []
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [VALID, REVOKED] }
                  institution: { type: [string, 'null'] }
                  course: { type: [string, 'null'] }
                  completedOn: { type: [string, 'null'], format: date }
                  student: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/Problem' }
  /reports/classes/{id}/progress:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [reports]
      summary: Class progress matrix (class teachers); lesson percent counts required lessons only, null when none are required
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Page of StudentProgressRow }
  /reports/classes/{id}/scores:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [reports]
      summary: Best published score per assignment with its revision; pending grading flagged, never shown as zero
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Page of StudentScoreRow }
  /reports/classes/{id}/export:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [reports]
      summary: Queue a formula-safe CSV export (UTC and institution-timezone times) for the requester only
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [type], properties: { type: { type: string, enum: [PROGRESS, SCORES] } } } } } }
      responses:
        '202': { description: Export queued }
  /reports/classes/{id}/exports:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [reports]
      summary: The caller's recent exports for the class
      responses:
        '200': { description: Exports }
  /reports/exports/{id}/download:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [reports]
      summary: Download a ready export; only the requester while they still teach the class
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
  responses:
    Problem:
      description: Problem response
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        fieldErrors: { type: object, additionalProperties: { type: string } }
        traceId: { type: string }
    Role: { type: string, enum: [ADMINISTRATOR, TEACHER, STUDENT] }
    AccountStatus: { type: string, enum: [ACTIVE, DISABLED] }
    CsrfToken:
      type: object
      properties: { headerName: { type: string }, token: { type: string } }
    LoginRequest:
      type: object
      required: [username, password]
      properties: { username: { type: string }, password: { type: string } }
    ChangePassword:
      type: object
      required: [currentPassword, newPassword]
      properties: { currentPassword: { type: string }, newPassword: { type: string, minLength: 12, maxLength: 128 } }
    TokenPassword:
      type: object
      required: [token, password]
      properties: { token: { type: string }, password: { type: string, minLength: 12, maxLength: 128 } }
    SetupRequest:
      type: object
      required: [setupToken, institutionName, timezone, username, displayName, email, password]
      properties:
        setupToken: { type: string }
        institutionName: { type: string, maxLength: 200 }
        timezone: { type: string, example: Asia/Dhaka }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
        password: { type: string }
    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: [string, 'null'] }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        passwordChangeRequired: { type: boolean }
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: [string, 'null'] }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        status: { $ref: '#/components/schemas/AccountStatus' }
        createdAt: { type: string, format: date-time }
        revision: { type: integer }
    AccountPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Account' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    CreateAccount:
      type: object
      required: [username, displayName, roles, delivery]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9._-]{3,64}$' }
        displayName: { type: string, maxLength: 150 }
        email: { type: [string, 'null'], description: Optional for students; required for staff and invitations }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        delivery: { type: string, enum: [INVITATION, TEMPORARY_PASSWORD] }
    CreatedAccount:
      type: object
      properties:
        account: { $ref: '#/components/schemas/Account' }
        temporaryCredential: { oneOf: [{ $ref: '#/components/schemas/TemporaryCredential' }, { type: 'null' }] }
        invitationExpiresAt: { type: [string, 'null'], format: date-time }
    UpdateAccount:
      type: object
      required: [displayName, roles, expectedRevision]
      properties:
        displayName: { type: string }
        email: { type: [string, 'null'] }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        expectedRevision: { type: integer }
    TemporaryCredential:
      type: object
      properties:
        username: { type: string }
        temporaryPassword: { type: string }
        expiresAt: { type: string, format: date-time }
    Institution:
      type: object
      properties: { name: { type: string }, timezone: { type: string }, logoAssetId: { type: [string, 'null'], format: uuid }, certificateVerification: { type: boolean }, verificationShowsStudent: { type: boolean }, revision: { type: integer } }
    UpdateInstitution:
      type: object
      required: [name, timezone, certificateVerification, verificationShowsStudent, expectedRevision]
      properties: { name: { type: string }, timezone: { type: string }, logoAssetId: { type: [string, 'null'], format: uuid }, certificateVerification: { type: boolean }, verificationShowsStudent: { type: boolean }, expectedRevision: { type: integer } }
    AssetPurpose: { type: string, enum: [VIDEO, DOCUMENT, BRANDING_IMAGE] }
    Asset:
      type: object
      properties:
        id: { type: string, format: uuid }
        purpose: { $ref: '#/components/schemas/AssetPurpose' }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        durationSeconds: { type: [integer, 'null'] }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        link: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
    NotificationPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    FailedJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        aggregateId: { type: [string, 'null'], format: uuid }
        attempts: { type: integer }
        lastError: { type: [string, 'null'] }
        failedAt: { type: string, format: date-time }
    FailedJobPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FailedJob' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    CourseSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        latestEdition: { type: [integer, 'null'] }
        draftRevision: { type: [integer, 'null'] }
        updatedAt: { type: string, format: date-time }
    CourseSummaryPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CourseSummary' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    CourseDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        teachers: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, displayName: { type: string } } } }
        editions: { type: array, items: { type: object, properties: { versionId: { type: string, format: uuid }, edition: { type: integer }, title: { type: string }, publishedAt: { type: string, format: date-time } } } }
        draft: { oneOf: [{ type: 'null' }, { type: object, properties: { versionId: { type: string, format: uuid }, revision: { type: integer }, basedOnEdition: { type: [integer, 'null'] } } }] }
    LessonVideo:
      type: object
      properties:
        assetId: { type: [string, 'null'], format: uuid }
