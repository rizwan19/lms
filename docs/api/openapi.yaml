openapi: 3.1.0
info:
  title: Learning Portal API
  version: 0.1.0
  description: |
    Same-origin REST API under /api/v1. Sessions are cookie-based (Spring Session JDBC); every
    mutating request carries the CSRF token from GET /auth/csrf in the X-XSRF-TOKEN header.
    Errors use RFC 9457-style problem responses {type,title,status,detail,code,fieldErrors,traceId}.
    Pages use {items,page,size,total} with zero-based pages, default size 25 and maximum 100.
    Unrelated or forbidden resources answer 404 so their existence is not exposed. Course routes answer only
    to the course's single author; approved teachers administer accounts but gain no course access.
    Breaking v2 release: classes and class routes are gone; see docs/api/course-centric-breaking-changes.md.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: setup
  - name: workspace
  - name: notifications
  - name: operations
  - name: media
  - name: catalog
  - name: courses
  - name: enrollment
  - name: learning
  - name: exams
  - name: attempts
  - name: grading
  - name: completion
  - name: certificates
  - name: reports
paths:
  /auth/csrf:
    get:
      tags: [auth]
      summary: "Issue the CSRF cookie and return the token"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      tags: [auth]
      summary: "Sign in with username or email; unverified accounts get a limited session"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [auth]
      summary: "Sign out and invalidate the session"
      x-security-filter: true
      responses:
        '204': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      tags: [auth]
      summary: "Current account: role, emailVerified, teacherStatus and capabilities"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /auth/me/password:
    put:
      tags: [auth]
      summary: "Change own password; revokes the account's other sessions"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '204': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /auth/register:
    post:
      tags: [auth]
      summary: "Public signup as TEACHER or STUDENT; returns no session or token"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /auth/email/verify:
    post:
      tags: [auth]
      summary: "Consume an email verification token"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '204': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /auth/email/resend:
    post:
      tags: [auth]
      summary: "Invalidate the previous link and send a new verification email"
      responses:
        '202': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /auth/password-reset/request:
    post:
      tags: [auth]
      summary: "Request a reset email to the verified address; always 202"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '202': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: "Set a new password with a 30-minute single-use token; revokes sessions"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '204': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /setup:
    get:
      tags: [setup]
      summary: "Setup state: REQUIRED, OWNER_VERIFICATION_PENDING or ACTIVE"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [setup]
      summary: "Create the unverified workspace owner and send the verification email"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '202': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /workspace:
    get:
      tags: [workspace]
      summary: "Public branding and settings"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
    put:
      tags: [workspace]
      summary: "Update settings (approved teachers)"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /workspace/users:
    get:
      tags: [workspace]
      summary: "Account administration list (approved teachers)"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /workspace/users/{id}:
    get:
      tags: [workspace]
      summary: "One account (approved teachers)"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /workspace/users/{id}/status:
    put:
      tags: [workspace]
      summary: "Suspend or reactivate an account; never your own"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /workspace/users/{id}/password-reset:
    post:
      tags: [workspace]
      summary: "Email the account a recovery link"
      responses:
        '202': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /workspace/teacher-applications:
    get:
      tags: [workspace]
      summary: "Teacher application inbox (approved teachers)"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /workspace/teacher-applications/{id}/decision:
    post:
      tags: [workspace]
      summary: "Approve or reject; first decision wins, no self-review"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /me/teacher-applications:
    post:
      tags: [workspace]
      summary: "Reapply after a rejection (24-hour cooldown)"
      responses:
        '201': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /me/teacher-application:
    get:
      tags: [workspace]
      summary: "Own latest teacher application"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /notifications:
    get:
      tags: [notifications]
      summary: "Own in-app notifications"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /notifications/{id}/read:
    put:
      tags: [notifications]
      summary: "Mark own notification read"
      responses:
        '204': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /admin/system-status:
    get:
      tags: [operations]
      summary: "SMTP configuration and failed job count (approved teachers)"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /admin/failed-jobs:
    get:
      tags: [operations]
      summary: "Terminally failed jobs (approved teachers)"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /admin/maintenance:
    get:
      tags: [operations]
      summary: "Maintenance state"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
    put:
      tags: [operations]
      summary: "Start or end maintenance"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /media:
    post:
      tags: [media]
      summary: "Raw-body upload; course files by verified teachers, branding by approved teachers"
      responses:
        '201': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /media/{id}:
    get:
      tags: [media]
      summary: "Asset metadata (uploader, course author, active learner)"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /media/{id}/content:
    get:
      tags: [media]
      summary: "Authorized private delivery with byte ranges"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /catalog/courses:
    get:
      tags: [catalog]
      summary: "Public summaries of active published courses"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /catalog/courses/{id}:
    get:
      tags: [catalog]
      summary: "Public course summary and outline"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses:
    get:
      tags: [courses]
      summary: "The author's own courses"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [courses]
      summary: "Create a course (verified teachers)"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses/{id}:
    get:
      tags: [courses]
      summary: "Course detail (author only)"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses/{id}/draft:
    get:
      tags: [courses]
      summary: "Draft content"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
    put:
      tags: [courses]
      summary: "Save the draft"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [courses]
      summary: "Start a correction draft from an edition"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses/{id}/publish:
    post:
      tags: [courses]
      summary: "Publish the draft as the next edition (approved author)"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses/{id}/preview:
    get:
      tags: [courses]
      summary: "Draft or edition as learners see it"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses/{id}/archive:
    post:
      tags: [courses]
      summary: "Archive: leaves the catalog, keeps existing learners"
      responses:
        '204': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses/{id}/restore:
    post:
      tags: [courses]
      summary: "Restore an archived course"
      responses:
        '204': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses/{id}/access-requests:
    get:
      tags: [enrollment]
      summary: "Author's request inbox"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [enrollment]
      summary: "Request access as a verified learner"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /me/access-requests:
    get:
      tags: [enrollment]
      summary: "Own access requests"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /access-requests/{id}/cancel:
    post:
      tags: [enrollment]
      summary: "Cancel own pending request"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /access-requests/{id}/decision:
    post:
      tags: [enrollment]
      summary: "Author approves (grants enrollment) or rejects"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses/{id}/invitations:
    get:
      tags: [enrollment]
      summary: "Author's invitations"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [enrollment]
      summary: "Invite one email address"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses/{id}/invitations/bulk:
    post:
      tags: [enrollment]
      summary: "Invite up to 100 unique addresses"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /course-invitations/{id}/revoke:
    post:
      tags: [enrollment]
      summary: "Revoke a pending invitation"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /course-invitations/accept:
    post:
      tags: [enrollment]
      summary: "Accept as the verified matching recipient"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /me/enrollments:
    get:
      tags: [enrollment]
      summary: "Own enrollments, including historical ones"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /me/enrollments/{id}/withdraw:
    post:
      tags: [enrollment]
      summary: "Withdraw from a course"
      responses:
        '204': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses/{id}/enrollments:
    get:
      tags: [enrollment]
      summary: "Author's roster"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /enrollments/{id}/status:
    put:
      tags: [enrollment]
      summary: "Author suspends or restores an enrollment"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /me/learning:
    get:
      tags: [learning]
      summary: "Own dashboard"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /me/enrollments/{id}/content:
    get:
      tags: [learning]
      summary: "Course player on the pinned edition"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /enrollments/{id}/lessons/{lessonId}/progress:
    put:
      tags: [learning]
      summary: "Save lesson progress with expected revision"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses/{id}/exams:
    get:
      tags: [exams]
      summary: "Exams of the course draft or an edition (author)"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [exams]
      summary: "Add an exam to the course draft"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /exams/{id}:
    get:
      tags: [exams]
      summary: "Exam content with keys (author)"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
    put:
      tags: [exams]
      summary: "Save exam content (course draft only)"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
