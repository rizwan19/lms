      tags: [grading]
      summary: "Own published result"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /me/enrollments/{id}/completion:
    get:
      tags: [completion]
      summary: "Own completion requirements"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /me/certificates:
    get:
      tags: [certificates]
      summary: "Own certificates"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses/{id}/certificates:
    get:
      tags: [certificates]
      summary: "Course certificates (author)"
      responses:
        '200': { description: OK }
