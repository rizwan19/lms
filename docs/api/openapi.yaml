      summary: "Grade a written answer"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /grading/attempts/{id}/finalize:
    post:
      tags: [grading]
      summary: "Finalize the open revision"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
