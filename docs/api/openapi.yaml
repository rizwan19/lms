      summary: "Save an answer (latest save wins)"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /attempts/{id}/submit:
    post:
      tags: [attempts]
      summary: "Submit (idempotent)"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /courses/{id}/grading:
    get:
      tags: [grading]
      summary: "Author's grading queue"
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /grading/attempts/{id}:
    get:
