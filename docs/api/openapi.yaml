      tags: [certificates]
      summary: "Revoke (author)"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Problem' }
  /certificates/{id}/reinstate:
    post:
      tags: [certificates]
      summary: "Reinstate (approved author)"
