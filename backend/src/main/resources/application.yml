spring:
  application:
    name: learning-portal
  datasource:
    url: ${LEARNING_DB_URL}
    username: ${LEARNING_DB_USERNAME}
    password: ${LEARNING_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false
  session:
    jdbc:
      initialize-schema: never

server:
  port: ${LEARNING_PORT:8080}
  address: ${LEARNING_BIND_ADDRESS:0.0.0.0}
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 60m
      cookie:
        name: LEARNING_SESSION
        http-only: true
        secure: ${LEARNING_SECURE_COOKIES:true}
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    port: ${LEARNING_MANAGEMENT_PORT:8081}
    # Health endpoints stay internal: never route this port through the public proxy.
    address: ${LEARNING_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,storage

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

learning:
  # Canonical public origin used in emailed links, e.g. https://learn.example.org (required).
  public-origin: ${LEARNING_PUBLIC_ORIGIN}
  mail:
    from: ${LEARNING_MAIL_FROM:}
  storage:
    mode: ${LEARNING_STORAGE_MODE:local}
    s3:
      endpoint: ${LEARNING_S3_ENDPOINT:}
      region: ${LEARNING_S3_REGION:us-east-1}
      bucket: ${LEARNING_S3_BUCKET:}
      access-key: ${LEARNING_S3_ACCESS_KEY:}
      secret-key: ${LEARNING_S3_SECRET_KEY:}
      path-style: ${LEARNING_S3_PATH_STYLE:false}
  media:
    storage-root: ${LEARNING_MEDIA_ROOT:data/media}
    staging-dir: ${LEARNING_STAGING_DIR:data/staging}
    ffprobe-path: ${LEARNING_FFPROBE:ffprobe}
