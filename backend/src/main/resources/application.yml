spring:
  application:
    name: learning-portal
  datasource:
    url: ${LEARNING_DB_URL}
    username: ${LEARNING_DB_USERNAME}
    password: ${LEARNING_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false
  session:
    jdbc:
      initialize-schema: never

server:
  port: ${LEARNING_PORT:8080}
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 60m
      cookie:
        name: LEARNING_SESSION
        http-only: true
        secure: ${LEARNING_SECURE_COOKIES:true}
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    port: ${LEARNING_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

learning:
  # Canonical public origin used in emailed links, e.g. https://learn.example.org (required).
  public-origin: ${LEARNING_PUBLIC_ORIGIN}
  identity:
    setup-token: ${LEARNING_SETUP_TOKEN:}
  mail:
    from: ${LEARNING_MAIL_FROM:}
  media:
    storage-root: ${LEARNING_MEDIA_ROOT:data/media}
    staging-dir: ${LEARNING_STAGING_DIR:data/staging}
    ffprobe-path: ${LEARNING_FFPROBE:ffprobe}
