# Production stack: docker compose -f deploy/compose.yml --env-file .env up -d
# Development database only: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml up -d postgres
name: learning-portal

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: learning
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d learning"]
      interval: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: learning-portal/app:${LEARNING_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LEARNING_DB_URL: jdbc:postgresql://postgres:5432/learning
      LEARNING_DB_USERNAME: learning
      LEARNING_DB_PASSWORD: ${POSTGRES_PASSWORD}
      LEARNING_PUBLIC_ORIGIN: ${LEARNING_PUBLIC_ORIGIN:?Set LEARNING_PUBLIC_ORIGIN in .env}
      LEARNING_SETUP_TOKEN: ${LEARNING_SETUP_TOKEN:-}
      LEARNING_SECURE_COOKIES: ${LEARNING_SECURE_COOKIES:-true}
      LEARNING_STORAGE_MODE: ${LEARNING_STORAGE_MODE:-local}
      LEARNING_S3_ENDPOINT: ${LEARNING_S3_ENDPOINT:-}
      LEARNING_S3_REGION: ${LEARNING_S3_REGION:-us-east-1}
      LEARNING_S3_BUCKET: ${LEARNING_S3_BUCKET:-}
      LEARNING_S3_ACCESS_KEY: ${LEARNING_S3_ACCESS_KEY:-}
      LEARNING_S3_SECRET_KEY: ${LEARNING_S3_SECRET_KEY:-}
      LEARNING_S3_PATH_STYLE: ${LEARNING_S3_PATH_STYLE:-false}
      LEARNING_MAIL_FROM: ${LEARNING_MAIL_FROM:-}
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      LEARNING_JOBS_ENABLED: ${LEARNING_JOBS_ENABLED:-true}
    volumes:
      - media-data:/data

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    image: learning-portal/web:${LEARNING_VERSION:-local}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      LEARNING_SITE_ADDRESS: ${LEARNING_SITE_ADDRESS:-:80}
      LEARNING_MEDIA_ORIGIN: ${LEARNING_MEDIA_ORIGIN:-}
    ports:
      - "${LEARNING_HTTP_PORT:-80}:80"
      - "${LEARNING_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  media-data:
  caddy-data:
  caddy-config:
